<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="gh-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bfe8ff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#9fd8ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#9fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gh-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4e6fa"/>
    </linearGradient>
  </defs>

  <!-- soft glow -->
  <circle cx="150" cy="150" r="148" fill="url(#gh-glow)"/>

  <!-- sheet body with wavy hem -->
  <path d="M70 170 Q70 26 150 24 Q230 26 230 170 L230 250 Q218 294 206 254 Q194 294 180 254 Q166 294 150 254 Q134 294 120 254 Q106 294 94 254 Q82 294 70 250 Z" fill="url(#gh-body)" stroke="#eaf8ff" stroke-width="3" stroke-linejoin="round" opacity="0.94"/>
  <!-- soft shading on the right side -->
  <path d="M212 90 Q226 130 222 200" fill="none" stroke="#9fd0f2" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- friendly big eyes -->
  <ellipse cx="124" cy="118" rx="11" ry="15" fill="#1c2740"/>
  <ellipse cx="176" cy="118" rx="11" ry="15" fill="#1c2740"/>
  <circle cx="128" cy="111" r="4" fill="#ffffff"/>
  <circle cx="180" cy="111" r="4" fill="#ffffff"/>

  <!-- blush -->
  <ellipse cx="106" cy="146" rx="9" ry="5.5" fill="#ff9ec0" opacity="0.5"/>
  <ellipse cx="194" cy="146" rx="9" ry="5.5" fill="#ff9ec0" opacity="0.5"/>

  <!-- slight smile -->
  <path d="M134 150 Q150 166 166 150" fill="none" stroke="#1c2740" stroke-width="3.5" stroke-linecap="round"/>

  <!-- small sparkles -->
  <polygon points="52,70 55,80 65,83 55,86 52,96 49,86 39,83 49,80" fill="#ffffff" opacity="0.8"/>
  <polygon points="252,96 254,103 261,105 254,107 252,114 250,107 243,105 250,103" fill="#ffffff" opacity="0.8"/>
</svg>
