<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- hair bun -->
  <circle cx="150" cy="42" r="18" fill="#d5d9e0" stroke="#f2e6dc" stroke-width="2"/>

  <!-- body: burgundy cardigan -->
  <path d="M66 278 L70 200 Q74 168 110 160 L150 170 L190 160 Q226 168 230 200 L234 278 Z" fill="#7a1f32" stroke="#f2d5d0" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- neck -->
  <rect x="136" y="150" width="28" height="24" fill="#e9bc9c"/>
  <!-- blouse V -->
  <path d="M134 160 L150 198 L166 160 Z" fill="#f4efe6"/>
  <!-- cardigan front edges -->
  <path d="M134 164 L124 278 M166 164 L176 278" fill="none" stroke="#4d1222" stroke-width="2.5" stroke-linecap="round"/>
  <!-- buttons -->
  <circle cx="150" cy="214" r="3.5" fill="#e8d6a0" stroke="#4d1222" stroke-width="1"/>
  <circle cx="150" cy="240" r="3.5" fill="#e8d6a0" stroke="#4d1222" stroke-width="1"/>
  <circle cx="150" cy="266" r="3.5" fill="#e8d6a0" stroke="#4d1222" stroke-width="1"/>

  <!-- left arm hanging -->
  <path d="M72 200 Q58 232 64 270 L84 272 Q84 236 94 208 Z" fill="#7a1f32" stroke="#f2d5d0" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="74" cy="268" rx="10" ry="9" fill="#e9bc9c" stroke="#f2d5d0" stroke-width="1.5"/>

  <!-- ears -->
  <circle cx="108" cy="116" r="8" fill="#f1cdb0" stroke="#f2d5d0" stroke-width="2"/>
  <circle cx="192" cy="116" r="8" fill="#f1cdb0" stroke="#f2d5d0" stroke-width="2"/>

  <!-- face -->
  <ellipse cx="150" cy="112" rx="42" ry="48" fill="#f1cdb0" stroke="#f2d5d0" stroke-width="2.5"/>

  <!-- silver hair -->
  <path d="M106 106 Q96 52 150 46 Q204 52 194 106 Q190 76 150 70 Q112 76 106 106 Z" fill="#d5d9e0" stroke="#f2e6dc" stroke-width="2" stroke-linejoin="round"/>

  <!-- brows -->
  <path d="M116 96 Q130 90 143 96 M157 96 Q170 90 184 96" fill="none" stroke="#9aa0aa" stroke-width="3.2" stroke-linecap="round"/>

  <!-- round gold glasses -->
  <circle cx="130" cy="114" r="14" fill="#cfe6f5" opacity="0.15"/>
  <circle cx="170" cy="114" r="14" fill="#cfe6f5" opacity="0.15"/>
  <circle cx="130" cy="114" r="14" fill="none" stroke="#d8c77a" stroke-width="3"/>
  <circle cx="170" cy="114" r="14" fill="none" stroke="#d8c77a" stroke-width="3"/>
  <path d="M144 112 Q150 108 156 112 M116 110 L106 106 M184 110 L194 106" fill="none" stroke="#d8c77a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- piercing eyes -->
  <ellipse cx="130" cy="116" rx="3" ry="3.5" fill="#2a2a33"/>
  <ellipse cx="170" cy="116" rx="3" ry="3.5" fill="#2a2a33"/>

  <!-- nose and expression -->
  <path d="M150 122 Q146 132 150 135 Q154 135 152 133" fill="none" stroke="#b98a72" stroke-width="2" stroke-linecap="round"/>
  <path d="M124 146 Q122 152 126 158 M176 146 Q178 152 174 158" fill="none" stroke="#c98f78" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M138 148 Q150 154 162 148" fill="none" stroke="#a9506a" stroke-width="3" stroke-linecap="round"/>

  <!-- right sleeve holding the tablet -->
  <path d="M226 180 Q246 210 238 252 L222 254 Q226 220 212 192 Z" fill="#7a1f32" stroke="#f2d5d0" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- tablet with papers -->
  <g transform="rotate(-8 226 214)">
    <rect x="198" y="180" width="58" height="72" rx="6" fill="#2b2f3f" stroke="#d8dde8" stroke-width="2.5"/>
    <rect x="205" y="188" width="44" height="56" rx="2" fill="#eef1f6"/>
    <path d="M209 198 H244 M209 208 H240 M209 218 H244 M209 228 H236" stroke="#8a93a6" stroke-width="2"/>
  </g>
  <!-- right hand supporting tablet -->
  <ellipse cx="226" cy="262" rx="12" ry="9" fill="#e9bc9c" stroke="#f2d5d0" stroke-width="1.5"/>
</svg>
