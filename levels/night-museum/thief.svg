<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="th-cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a36"/>
      <stop offset="1" stop-color="#0d0d13"/>
    </linearGradient>
    <linearGradient id="th-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d6ba"/>
      <stop offset="1" stop-color="#e5b08e"/>
    </linearGradient>
  </defs>

  <!-- ponytail (behind hood, right side) -->
  <path d="M180 70 Q224 98 214 158 Q210 170 202 158 Q212 112 176 86 Z" fill="#4a1f2e" stroke="#e6dcf0" stroke-width="2" stroke-linejoin="round"/>

  <!-- hood (back) -->
  <path d="M100 110 Q96 40 150 28 Q204 40 200 110 L206 160 Q150 146 94 160 Z" fill="url(#th-cloak)" stroke="#e6dcf0" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- neck -->
  <rect x="136" y="128" width="28" height="30" fill="#e8b895"/>

  <!-- cloak body -->
  <path d="M100 176 Q110 158 150 156 Q190 158 200 176 L216 278 L84 278 Z" fill="url(#th-cloak)" stroke="#e6dcf0" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- sash -->
  <rect x="98" y="214" width="104" height="8" rx="2" fill="#2b2b38"/>

  <!-- arms and hands -->
  <path d="M104 178 Q90 210 92 250 L104 252 Q106 214 118 188 Z" fill="#1a1a24" stroke="#e6dcf0" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="98" cy="260" rx="6" ry="9" fill="#f4d2b4"/>
  <path d="M196 178 Q210 210 208 250 L198 252 Q196 214 184 190 Z" fill="#1a1a24" stroke="#e6dcf0" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="203" cy="260" rx="6" ry="9" fill="#f4d2b4"/>

  <!-- shoulder strap and small bag -->
  <path d="M116 168 L178 230" stroke="#6b4426" stroke-width="5" stroke-linecap="round"/>
  <rect x="172" y="222" width="30" height="26" rx="5" fill="#8a5630" stroke="#e6dcf0" stroke-width="2"/>
  <path d="M172 232 Q187 240 202 232" fill="none" stroke="#5a3418" stroke-width="2.5"/>
  <circle cx="187" cy="238" r="2.5" fill="#e6c26a"/>

  <!-- face -->
  <ellipse cx="150" cy="96" rx="36" ry="42" fill="url(#th-skin)" stroke="#f5ead2" stroke-width="2"/>

  <!-- hood front rim framing the face -->
  <path d="M110 124 Q102 50 150 44 Q198 50 190 124 L182 124 Q180 62 150 60 Q120 62 118 124 Z" fill="#0f0f16" stroke="#e6dcf0" stroke-width="2" stroke-linejoin="round"/>

  <!-- black mask -->
  <path d="M112 92 L102 84 L108 100 Z M188 92 L198 84 L192 100 Z" fill="#0a0a0f"/>
  <path d="M112 92 Q150 80 188 92 L182 108 Q150 118 118 108 Z" fill="#0a0a0f" stroke="#e6dcf0" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- green eyes peeking through the mask -->
  <ellipse cx="132" cy="100" rx="7" ry="3.8" fill="#5fe08a"/>
  <ellipse cx="168" cy="100" rx="7" ry="3.8" fill="#5fe08a"/>
  <circle cx="133" cy="100" r="2" fill="#0a0a0f"/>
  <circle cx="167" cy="100" r="2" fill="#0a0a0f"/>

  <!-- nose -->
  <path d="M150 108 Q146 116 150 118" fill="none" stroke="#b07a5e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- sly smirk -->
  <path d="M134 126 Q152 136 168 118" fill="none" stroke="#7a2e3a" stroke-width="2.8" stroke-linecap="round"/>
</svg>
