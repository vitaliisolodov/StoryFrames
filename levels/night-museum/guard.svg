<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gd-uniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23466e"/>
      <stop offset="1" stop-color="#14263f"/>
    </linearGradient>
    <linearGradient id="gd-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c79f"/>
      <stop offset="1" stop-color="#dba07a"/>
    </linearGradient>
  </defs>

  <!-- neck -->
  <rect x="130" y="140" width="40" height="20" fill="#dba07a"/>

  <!-- uniform body -->
  <path d="M76 278 L70 206 Q70 166 112 158 L130 152 L150 166 L170 152 L188 158 Q230 166 230 206 L224 278 Z" fill="url(#gd-uniform)" stroke="#c9d8ee" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- shirt collar -->
  <path d="M134 154 L150 182 L166 154 Z" fill="#e9eef5"/>
  <!-- buttons -->
  <circle cx="150" cy="198" r="3.5" fill="#e0b84f"/>
  <circle cx="150" cy="218" r="3.5" fill="#e0b84f"/>
  <circle cx="150" cy="238" r="3.5" fill="#e0b84f"/>
  <!-- chest badge -->
  <path d="M104 196 L120 196 L120 210 L112 218 L104 210 Z" fill="#e0b84f" stroke="#1d1a22" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- belt -->
  <rect x="71" y="246" width="158" height="11" fill="#0c1826"/>
  <rect x="141" y="243" width="18" height="17" rx="2" fill="#e0b84f" stroke="#1d1a22" stroke-width="1.5"/>

  <!-- left arm (hangs) and hand -->
  <path d="M72 170 Q56 206 62 254 L84 256 Q84 214 98 180 Z" fill="url(#gd-uniform)" stroke="#c9d8ee" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="72" cy="262" rx="11" ry="13" fill="url(#gd-skin)" stroke="#f5ead2" stroke-width="2"/>

  <!-- right arm (holds flashlight) -->
  <path d="M228 170 Q252 196 246 232 L232 236 Q234 202 214 180 Z" fill="url(#gd-uniform)" stroke="#c9d8ee" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="240" cy="240" rx="10" ry="9" fill="url(#gd-skin)" stroke="#f5ead2" stroke-width="2"/>

  <!-- flashlight and beam -->
  <path d="M290 224 L298 206 L298 280 L290 250 Z" fill="#ffe9a0" opacity="0.35"/>
  <rect x="246" y="232" width="30" height="14" rx="3" fill="#2b2b33" stroke="#c9d8ee" stroke-width="1.5"/>
  <path d="M274 228 L290 222 L290 252 L274 246 Z" fill="#3c3c48" stroke="#c9d8ee" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- head -->
  <ellipse cx="150" cy="104" rx="42" ry="46" fill="url(#gd-skin)" stroke="#f5ead2" stroke-width="2.5"/>
  <circle cx="108" cy="108" r="8" fill="#dba07a" stroke="#f5ead2" stroke-width="2"/>
  <circle cx="192" cy="108" r="8" fill="#dba07a" stroke="#f5ead2" stroke-width="2"/>

  <!-- cap -->
  <path d="M106 66 Q106 30 150 30 Q194 30 194 66 Z" fill="#17304f" stroke="#c9d8ee" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="104" y="58" width="92" height="10" rx="2" fill="#0d1d33"/>
  <path d="M96 66 Q150 76 206 66 L202 78 Q150 88 100 78 Z" fill="#0d1d33" stroke="#c9d8ee" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="150" cy="46" r="6" fill="#e0b84f" stroke="#1d1a22" stroke-width="1.5"/>

  <!-- sleepy eyes -->
  <path d="M120 102 A10 6 0 0 0 140 102 Z" fill="#fff8ea"/>
  <path d="M160 102 A10 6 0 0 0 180 102 Z" fill="#fff8ea"/>
  <circle cx="130" cy="104" r="3" fill="#2a1c14"/>
  <circle cx="170" cy="104" r="3" fill="#2a1c14"/>
  <path d="M119 100 L141 100 M159 100 L181 100" stroke="#3a2a20" stroke-width="3" stroke-linecap="round"/>

  <!-- heavy brows -->
  <path d="M118 90 Q130 84 141 91 M159 91 Q170 84 182 90" fill="none" stroke="#3a2a20" stroke-width="4" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M150 106 Q145 120 150 124 Q154 125 158 122" fill="none" stroke="#8a5a3c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- big mustache -->
  <path d="M122 128 Q134 116 150 124 Q166 116 178 128 Q172 140 150 134 Q128 140 122 128 Z" fill="#4a3426" stroke="#1d1a22" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
